# Rebuilds the pages on every pull request and push to main, and fails if the
# committed HTML is out of date (someone edited _build/ or assets/ without rebuilding).
name: Build check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        env:
          PYTHONIOENCODING: utf-8
        run: python _build/build.py
      - name: Fail if generated pages are out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated pages differ from the committed ones. Run: python _build/build.py and commit the result."
            git status --porcelain | head -50
            exit 1
          fi
